name: Daily Commits

on:
  schedule:
    # 17:00 UTC == 22:30 Asia/Colombo (UTC+5:30)
    - cron: "0 17 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-commits
  cancel-in-progress: false

jobs:
  commit:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Colombo
      GIT_AUTHOR_NAME: SihanUdayaratna03
      GIT_AUTHOR_EMAIL: sihanudayaratna92@gmail.com
      MAX_LOG_ENTRIES: "40"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure git identity
        run: |
          git config user.name  "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"

      - name: Create 10 commits
        run: |
          set -euo pipefail

          MARKER="## Activity Log"

          if [ ! -f README.md ]; then
            printf '# Sihan Udayaratna\n\n' > README.md
          fi
          if ! grep -qxF "$MARKER" README.md; then
            printf '\n%s\n\n' "$MARKER" >> README.md
          fi

          LINE=$(grep -nxF "$MARKER" README.md | head -1 | cut -d: -f1)
          head -n "$LINE" README.md > /tmp/readme.head
          tail -n +"$((LINE + 1))" README.md | grep '^- ' | tail -n "$MAX_LOG_ENTRIES" > /tmp/readme.log || true
          { cat /tmp/readme.head; printf '\n'; cat /tmp/readme.log; } > README.md

          MESSAGES=(
            "docs: refresh activity log"
            "chore: update README timestamp"
            "docs: append daily entry to README"
            "chore: routine README maintenance"
            "docs: log daily activity"
            "chore: sync README metadata"
            "docs: record daily checkpoint"
            "chore: tidy up activity section"
            "docs: add activity entry"
            "chore: daily README update"
          )

          for i in $(seq 1 10); do
            STAMP=$(date '+%Y-%m-%d %H:%M:%S %Z')
            printf -- '- %s — entry %02d\n' "$STAMP" "$i" >> README.md
            git add README.md
            git commit -m "${MESSAGES[$((i - 1))]}"
            sleep 1
          done

      - name: Push
        run: |
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
